<!DOCTYPE HTML>
<html lang="en">
<head>
    <!-- when using the mode "code", it's important to specify charset utf-8 -->
    <meta charset="utf-8">

    <script src="
https://cdn.jsdelivr.net/npm/jsoneditor@10.4.3/dist/jsoneditor.min.js
"></script>
    <link href="
https://cdn.jsdelivr.net/npm/jsoneditor@10.4.3/dist/jsoneditor.min.css
" rel="stylesheet">
</head>
<body>
<div id="jsoneditor" style="width: 400px; height: 400px;"></div>

<script>
    // create the editor
    const container = document.getElementById("jsoneditor")
    const options = {}
    const editor = new JSONEditor(container, options)

    // set json
    const initialJson = {
        "Array": [1, 2, 3],
        "Boolean": true,
        "Null": null,
        "Number": 123,
        "Object": {"a": "b", "c": "d"},
        "String": "Hello World"
    }
    editor.set(initialJson)

    // get json
    const updatedJson = editor.get()
</script>
</body>
</html>
